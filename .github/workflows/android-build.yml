
name: VERITY Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies and generate lock file
        working-directory: mobile
        run: npm install

      - name: Commit package lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add mobile package lock file"
            git push
          fi

      - name: Check Expo configuration
        working-directory: mobile
        run: npx expo config --json

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Check EAS CLI
        working-directory: mobile
        run: npx eas-cli --version

      - name: Build Android APK
        working-directory: mobile
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
