name: VERITY Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify scanner files exist
        run: |
          echo "Current commit:"
          git rev-parse HEAD
          echo "Checking scanner file:"
          if [ -f mobile/app/scanner-screen.tsx ]; then
            echo "SUCCESS: scanner-screen.tsx exists."
          else
            echo "ERROR: scanner-screen.tsx is missing."
            find mobile/app -maxdepth 2 -type f
            exit 1
          fi
          echo "Checking screens.tsx:"
          if [ -f mobile/app/screens.tsx ]; then
            grep -n "scanner-screen" mobile/app/screens.tsx
          else
            echo "ERROR: screens.tsx is missing."
            exit 1
          fi

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Check Expo configuration
        working-directory: mobile
        run: npx expo config --json

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Verify scanner files before EAS upload
        working-directory: mobile
        run: |
          echo "Working directory:"
          pwd
          ls -la app/
          echo "Scanner screen:"
          ls -l app/scanner-screen.tsx
          echo "Screen imports:"
          sed -n '1,40p' app/screens.tsx
          echo "EAS ignore file:"
          if [ -f .easignore ]; then
            cat .easignore
          else
            echo "No .easignore file found."
          fi

      - name: Build Android APK
        working-directory: mobile
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
