
name: VERITY Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Synchronise package lock
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts

      - name: Save updated package lock to GitHub
        shell: bash
        run: |
          set -e

          if ! git diff --quiet -- mobile/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add mobile/package-lock.json
            git commit -m "Update VERITY dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Package lock is already up to date."
          fi

      - name: Verify scanner files exist
        shell: bash
        run: |
          set -e

          echo "Current commit:"
          git rev-parse HEAD

          find "$GITHUB_WORKSPACE/mobile/app" -maxdepth 1 -type f -iname '*scanner*' -print

          test -f "$GITHUB_WORKSPACE/mobile/app/scanner-screen.tsx"
          test -f "$GITHUB_WORKSPACE/mobile/app/screens.tsx"

          grep -n 'scanner-screen' "$GITHUB_WORKSPACE/mobile/app/screens.tsx"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Check Expo configuration
        working-directory: mobile
        run: npx expo config --json

      - name: Verify files before EAS upload
        working-directory: mobile
        run: |
          set -e
          pwd
          ls -l app/scanner-screen.tsx
          sed -n '1,50p' app/screens.tsx
          ls -l package-lock.json

          if [ -f .easignore ]; then
            cat .easignore
          fi

      - name: Build Android APK
        working-directory: mobile
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
