
name: VERITY Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

          
      - name: Install dependencies
        working-directory: mobile
        run: npm install
        
      - name: Save package lock file
        uses: actions/upload-artifact@v4
        with:
          name: verity-package-lock
          path: mobile/package-lock.json
          if-no-files-found: error

      - name: Check Expo configuration
        working-directory: mobile
        run: npx expo config --json

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Set up Expo and EAS
        working-directory: mobile
        run: npx eas-cli --version

      - name: Build Android APK
        working-directory: mobile
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
