
name: VERITY Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify scanner files exist
        shell: bash
        run: |
          set -e
          echo "Current commit:"
          git rev-parse HEAD

          echo "Scanner files found:"
          find "$GITHUB_WORKSPACE/mobile/app" -maxdepth 1 -type f -iname '*scanner*' -print

          echo "Files in mobile/app:"
          ls -lb "$GITHUB_WORKSPACE/mobile/app/"

          test -f "$GITHUB_WORKSPACE/mobile/app/scanner-screen.tsx" || {
            echo "ERROR: scanner-screen.tsx is missing."
            exit 1
          }

          test -f "$GITHUB_WORKSPACE/mobile/app/screens.tsx" || {
            echo "ERROR: screens.tsx is missing."
            exit 1
          }

          echo "Scanner import:"
          grep -n 'scanner-screen' "$GITHUB_WORKSPACE/mobile/app/screens.tsx"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Check Expo configuration
        working-directory: mobile
        run: npx expo config --json

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Verify files before EAS upload
        working-directory: mobile
        shell: bash
        run: |
          set -e
          ls -l app/scanner-screen.tsx
          sed -n '1,50p' app/screens.tsx

          if [ -f .easignore ]; then
            echo "Contents of .easignore:"
            cat .easignore
          else
            echo "No mobile/.easignore file found."
          fi

      - name: Build Android APK
        working-directory: mobile
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
